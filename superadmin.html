<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MWCS | Super Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-900">

  <div id="superAdminLogin" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-6"><i class="fas fa-crown text-5xl text-orange-600 mb-3"></i><h1 class="text-2xl font-bold">MWCS Super Admin</h1><p class="text-gray-500 text-sm">Authorized access only</p></div>
      <div id="superLoginMessage" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
      <input type="email" id="superEmail" placeholder="Super Admin Email" class="w-full p-3 border rounded-lg mb-3">
      <input type="password" id="superPassword" placeholder="Password" class="w-full p-3 border rounded-lg mb-4">
      <button onclick="superAdminLogin()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-lg font-semibold transition"><i class="fas fa-sign-in-alt mr-2"></i> Login</button>
    </div>
  </div>

  <div id="superAdminDashboard" class="hidden min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-white"><i class="fas fa-crown text-orange-500 mr-2"></i>MWCS Super Admin</h1>
        <div class="flex gap-3"><span class="bg-gray-800 text-orange-400 px-4 py-2 rounded-lg" id="superAdminEmail">Loading...</span><button onclick="superAdminLogout()" class="bg-red-600 px-4 py-2 rounded-lg text-white">Logout</button><a href="admin.html" class="bg-gray-700 px-4 py-2 rounded-lg text-white">Admin Panel</a></div>
      </div>
      
      <div class="grid md:grid-cols-4 gap-5 mb-8">
        <div class="bg-gradient-to-r from-orange-900 to-orange-800 rounded-xl p-5 text-white"><i class="fas fa-users text-3xl mb-2"></i><p class="text-2xl font-bold" id="totalAdmins">0</p><p class="text-sm">Admin Accounts</p></div>
        <div class="bg-gradient-to-r from-blue-900 to-blue-800 rounded-xl p-5 text-white"><i class="fas fa-envelope text-3xl mb-2"></i><p class="text-2xl font-bold" id="resetSentCount">0</p><p class="text-sm">Reset Links Sent</p></div>
      </div>
      
      <div class="bg-gray-800 rounded-2xl p-6 mb-8">
        <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-key text-orange-500 mr-2"></i>Reset Admin Password</h2>
        <div class="flex gap-4"><input type="email" id="targetAdminEmail" placeholder="Admin Email" class="flex-1 px-4 py-3 bg-gray-700 rounded-lg text-white"><button onclick="sendResetLink()" class="bg-orange-600 px-6 py-3 rounded-lg text-white">Send Reset</button></div>
        <div id="resetResult" class="mt-4 hidden p-3 rounded-lg"></div>
      </div>
      
      <div class="bg-gray-800 rounded-2xl p-6 mb-8">
        <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-user-plus text-orange-500 mr-2"></i>Create New Admin</h2>
        <div class="grid md:grid-cols-2 gap-4"><input type="email" id="newAdminEmail" placeholder="Email" class="px-4 py-3 bg-gray-700 rounded-lg text-white"><input type="password" id="newAdminPassword" placeholder="Password" class="px-4 py-3 bg-gray-700 rounded-lg text-white"></div>
        <button onclick="createNewAdmin()" class="mt-4 bg-green-600 px-6 py-3 rounded-lg text-white">Create Account</button>
        <div id="createResult" class="mt-4 hidden p-3 rounded-lg"></div>
      </div>
      
      <div class="bg-gray-800 rounded-2xl p-6">
        <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-list text-orange-500 mr-2"></i>Admin Accounts</h2>
        <div id="adminsList" class="text-gray-300">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARJrCy-uXM-sYyEpG2uZ8Sj5FBBDK1f9M",
      authDomain: "mwcs-b2e0e.firebaseapp.com",
      projectId: "mwcs-b2e0e",
      storageBucket: "mwcs-b2e0e.firebasestorage.app",
      messagingSenderId: "216297038440",
      appId: "1:216297038440:web:cb685e4c7a5422f90711dd"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const SUPER_ADMIN_EMAIL = "admin@mwcs.co.ke";
    let resetLinksSent = 0;
    
    async function superAdminLogin() {
      const email = document.getElementById('superEmail').value;
      const password = document.getElementById('superPassword').value;
      if (email !== SUPER_ADMIN_EMAIL) { showMessage('superLoginMessage', 'Unauthorized', true); return; }
      try { await auth.signInWithEmailAndPassword(email, password);
        document.getElementById('superAdminLogin').classList.add('hidden');
        document.getElementById('superAdminDashboard').classList.remove('hidden');
        document.getElementById('superAdminEmail').innerText = email;
        loadAdmins();
      } catch (error) { showMessage('superLoginMessage', error.message, true); }
    }
    
    async function sendResetLink() {
      const email = document.getElementById('targetAdminEmail').value;
      if (!email) { showMessage('resetResult', 'Enter email', true); return; }
      try { await auth.sendPasswordResetEmail(email); resetLinksSent++; document.getElementById('resetSentCount').innerText = resetLinksSent;
        showMessage('resetResult', `✅ Reset link sent to ${email}`, false);
      } catch (error) { showMessage('resetResult', error.message, true); }
    }
    
    async function createNewAdmin() {
      const email = document.getElementById('newAdminEmail').value;
      const password = document.getElementById('newAdminPassword').value;
      try { await auth.createUserWithEmailAndPassword(email, password);
        showMessage('createResult', `✅ Admin ${email} created`, false);
      } catch (error) { showMessage('createResult', error.message, true); }
    }
    
    async function loadAdmins() {
      const adminsDiv = document.getElementById('adminsList');
      adminsDiv.innerHTML = '<p class="text-gray-400">Loading admin accounts from Firebase Auth...</p><p class="text-xs text-gray-500 mt-2">Full list available in Firebase Console → Authentication → Users</p>';
    }
    
    function showMessage(elementId, text, isError) {
      const msgDiv = document.getElementById(elementId);
      msgDiv.innerHTML = text;
      msgDiv.className = `mt-4 p-3 rounded-lg text-sm ${isError ? 'bg-red-900 text-red-200' : 'bg-green-900 text-green-200'}`;
      msgDiv.classList.remove('hidden');
      setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }
    
    function superAdminLogout() { auth.signOut(); location.reload(); }
    auth.onAuthStateChanged((user) => { if (user && user.email === SUPER_ADMIN_EMAIL) { document.getElementById('superAdminLogin').classList.add('hidden'); document.getElementById('superAdminDashboard').classList.remove('hidden'); document.getElementById('superAdminEmail').innerText = user.email; loadAdmins(); } });
  </script>
</body>
</html>
